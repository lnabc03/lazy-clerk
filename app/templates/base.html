<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}lazy-clerk{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f6f8; }
        .card-narrow { max-width: 420px; margin: 6rem auto; }
        .table-sm td, .table-sm th { vertical-align: middle; }
        /* 医院系统可及性热力图（登录页）：近 14 天 × 24 小时 */
        .probe-row { display: flex; align-items: center; gap: 2px; margin-bottom: 2px; }
        .probe-day { width: 36px; font-size: 10px; color: #6c757d; flex: none; }
        .probe-cell { width: 11px; height: 11px; border-radius: 2px; flex: none; }
        .probe-cell.ok { background: #198754; }
        .probe-cell.proxy { background: #0d6efd; }
        .probe-cell.fail { background: #dc3545; }
        .probe-cell.none { background: #e9ecef; }
        .probe-legend { font-size: 10px; color: #6c757d; }
        .probe-legend .probe-cell { display: inline-block; vertical-align: -1px; }
        /* 服务摘要（热力图卡内）：一句话，数字强调，稳定天数绿色 */
        .svc-summary { text-align: center; font-size: 12.5px; color: #6c757d;
                       background: linear-gradient(135deg, #f8fafc, #eff4fb);
                       border: 1px solid #e8edf3; border-radius: 8px;
                       padding: 7px 10px; margin-bottom: 10px; }
        .svc-summary b { color: #212529; font-size: 14px; padding: 0 1px;
                         font-variant-numeric: tabular-nums; }
        .svc-summary .streak { color: #198754; }
        /* 日志分析（管理页）：每轮完成 chip 与出口节点 chip */
        .pace-chip { display: inline-block; font-size: 11px; background: #e7f1ff;
                     color: #0d6efd; border-radius: 10px; padding: 1px 8px;
                     margin: 1px 2px 1px 0; white-space: nowrap; }
        .node-chip { display: inline-block; font-size: 11px; background: #f8f9fa;
                     border: 1px solid #dee2e6; border-radius: 10px; padding: 1px 8px;
                     margin: 1px 2px 1px 0; }
        .analysis-detail td { border-top: none; padding-top: 0; }
    </style>
</head>
<body>
<div class="container py-4">
    {% if msg %}<div class="alert alert-success">{{ msg }}</div>{% endif %}
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
