<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}lazy-clerk{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f6f8; }
        .card-narrow { max-width: 420px; margin: 6rem auto; }
        .table-sm td, .table-sm th { vertical-align: middle; }
        /* 医院系统可及性热力图（登录页）：近 14 天 × 24 小时 */
        .probe-row { display: flex; align-items: center; gap: 2px; margin-bottom: 2px; }
        .probe-day { width: 36px; font-size: 10px; color: #6c757d; flex: none; }
        .probe-cell { width: 11px; height: 11px; border-radius: 2px; flex: none; }
        .probe-cell.ok { background: #198754; }
        .probe-cell.proxy { background: #0d6efd; }
        .probe-cell.fail { background: #dc3545; }
        .probe-cell.none { background: #e9ecef; }
        .probe-legend { font-size: 10px; color: #6c757d; }
        .probe-legend .probe-cell { display: inline-block; vertical-align: -1px; }
    </style>
</head>
<body>
<div class="container py-4">
    {% if msg %}<div class="alert alert-success">{{ msg }}</div>{% endif %}
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
