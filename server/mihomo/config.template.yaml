# mihomo 配置模板：订阅链接与 API 密钥在容器启动时从 .env 注入（见 docker-compose.yml）。
# 分流策略：仅医院域名走 hospital 组（app 双通道探针决定直连还是代理），其余全部直连。
mixed-port: 7890
# 必须 true：app 容器经 docker 网络用 mihomo:7890 访问，mixed-port 需绑定
# 到容器网卡（0.0.0.0）。7890 未映射到宿主，仅 docker 内网可达，安全无虞。
allow-lan: true
log-level: warning
external-controller: 0.0.0.0:9090   # 容器内监听；宿主只映射 127.0.0.1，且有 secret
secret: __SECRET__

proxy-providers:
  sub:
    type: http
    url: "__SUB_URL__"
    interval: 3600                   # 订阅每小时刷新：节点池变化（上下线/换 IP）及时跟进
    # 中立 204 测速（所有代理客户端的默认行为）。历史教训：曾用医院首页做
    # 全节点健康检查（98 节点 × 每 5 分钟 ≈ 2.8 万次/天），对医院 WAF 形同
    # 扫描器、对机场形同滥用，疑为出口被批量拉黑/账号被限流的自伤来源
    # （2026-09-17 排查定论，见 KNOWN_ISSUES.md）。医院可达性由 app 低频实测把关。
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      expected-status: "204"
      interval: 600

proxy-groups:
  # 钉节点组（流量承接者）：app 按医院实测钉住一个节点，select 不自主切换——
  # 好节点一直用，只在实测失败时由 app 重选（手动钉 IEPL 的同款用法）。
  # 历史教训：url-test 每 5 分钟单样本重选 = 每 5 分钟把流量交给一个陌生出口
  # （实测签到检测中途节点被换掉），且单样本测速抓不住节点分钟级坏相。
  - name: hospital-pin
    type: select
    use: [sub]
    exclude-filter: "剩余流量|套餐|到期|官网|客服"

  # 出口选择器：DIRECT 还是代理，由 app 的双通道探针决定（app 是唯一大脑，
  # 这里只执行不自主切换）
  - name: hospital
    type: select
    proxies: [DIRECT, hospital-pin]

rules:
  - DOMAIN-SUFFIX,my.gzsums.net,hospital
  - MATCH,DIRECT
